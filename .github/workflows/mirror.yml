name: Repo Mirror

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Add mirror notice
        run: |
          if [ -f README.md ] && ! grep -q "Mirror Repository" README.md; then
            REPO_NAME=$(basename $GITHUB_REPOSITORY)
            printf "# Heads up! This is a mirror repo\n\nThis repo is a mirror of the repo on GitHub. Please make issues and PRs there!\n\nGitHub: https://github.com/splamei/$REPO_NAME\n\n---\n\n" | cat - README.md > temp && mv temp README.md
            
            git config user.name "Splamei Mirror Bot"
            git config user.email "DoNotReply@veemo.uk"
            
            git commit -am "mirror bot: Added README mirror notice"
          fi

      - name: Mirror repo
        run: |
          git config --global push.followTags false

          REPO_NAME=$(basename $GITHUB_REPOSITORY)
          git remote add codeberg https://oauth2:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/splamei/$REPO_NAME.git

          git fetch --all --depth 1
          git remote prune origin
      
          git push codeberg +refs/heads/*:refs/heads/*