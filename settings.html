<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Settings - Rhythm Plus Splamei Client</title>
</head>
<body>
  <h2>Settings</h2>

  <label>
    <input type="checkbox" id="v2-mode" />
    Prefer R+ V2
  </label>
  <br/><br/>

  <label>
    Show menu when...
    <select id="show-menu">
      <option value="always">Always</option>
      <option value="alwaysExceptGame">Always except in-game</option>
    </select>
  </label>
  <br/><br/>

  <button id="save-btn">Save Settings</button>

  <script src="settings.js"></script>
</body>
</html>
