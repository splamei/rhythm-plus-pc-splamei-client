<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Rhythm Plus Splamei Client</title>
  <style>
    body
    {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      color: #ffffff;
      background-color: #141414
    }

    .button
    {
      background-color: black;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      display: inline-block;
      margin: 5px 2px;
      transition: 0.5s;
    }

    .green-button
    {
      border: 2px solid purple;
      border-radius: 12px;
    }

    .green-button:hover
    {
      background-color: purple;
      color: white;
    }

    input[type="checkbox"]
    {
      box-sizing: border-box;
      width: 20px;
      height: 20px;
      margin: 6px;
      padding: 0;
      border-radius: 20px;
      appearance: none;
      background-color: #9e9e9e;
      outline: none;
      transition: 0.2s;
      align-items: center;
    }

    input[type="checkbox"]:checked
    {
      background-size: cover;
      padding: 2px;
    }

    input[type="checkbox"]:not(:disabled):checked
    {
      border-color: transparent;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="20" height="20" viewBox="0 0 1080 1080" xml:space="preserve"><path style="fill: %23b2006d" fill-rule="evenodd" class="a" d="m539.5 870c-182.8 0-330.5-147.7-330.5-330.5 0-182.8 147.7-330.5 330.5-330.5 182.8 0 330.5 147.7 330.5 330.5 0 182.8-147.7 330.5-330.5 330.5z"/></svg>');
    }

    @media (hover: hover) {
    input[type="checkbox"]:not(:disabled):hover {
      background-color: #818181;
      outline: 6px solid var(--checkbox-hover-color);
      transform: scale(1.05);
    }
  }
  </style>
</head>
<table role="presentation" border="0" cellpadding="0" cellspacing="0" id="body" width="100%" style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #ffffff; background-color: #141414">
<tbody><tr>
<td align="left" style="padding: 0 20px">
  <h1>Settings</h1>
  <p>Control the client!</p>

  <br>
  <p style="border: none; border-top: 1px dashed #696969; font-size: 1px; width: 100%"></p>
  <br/>

  <h3>General</h3>

  <label>
    <input type="checkbox" id="v2-mode" />
    Prefer R+ V2
  </label>
  <br/><br/>

  <label>
    Show the menu...
    <select id="show-menu">
      <option value="always">Always</option>
      <option value="alwaysExceptGame">Always except in-game</option>
    </select>
  </label>
  <br/><br/>

  <p style="border: none; border-top: 1px dashed #696969; font-size: 1px; width: 100%"></p>
  <br/>

  <h3>Discord Rich Presence</h3>
  <p>This only applies if you have the Discord app installed and your device supports Rich Presence</p>

  <label>
    <input type="checkbox" id="discord-rpc-enable" />
    Enable Discord Rich Presence
  </label>
  <br/><br/>

  <label>
    <input type="checkbox" id="discord-rpc-details" />
    - Display details within Discord RPC
  </label>
  <br/><br/>

  <p style="border: none; border-top: 1px dashed #696969; font-size: 1px; width: 100%"></p>
  <br/>

  <button id="save-btn" class="button green-button">Save Settings</button>
  </table>

  <script src="settings.js"></script>
</body>
</html>
