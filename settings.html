<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Rhythm Plus Splamei Client</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #ffffff; background-color: #141414">
<table role="presentation" border="0" cellpadding="0" cellspacing="0" id="body" width="100%" style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #ffffff; background-color: #141414">
<tbody><tr>
<td align="left" style="padding: 0 20px">
  <h1>Settings</h1>

  <p style="border: none; border-top: 1px dashed #ffffff; font-size: 1px; width: 100%"></p>
  <br/>

  <h3>General</h3>

  <label>
    <input type="checkbox" id="v2-mode" />
    Prefer R+ V2
  </label>
  <br/><br/>

  <label>
    Show the menu...
    <select id="show-menu">
      <option value="always">Always</option>
      <option value="alwaysExceptGame">Always except in-game</option>
    </select>
  </label>
  <br/><br/>

  <p style="border: none; border-top: 1px dashed #ffffff; font-size: 1px; width: 100%"></p>
  <br/>

  <h3>Discord Rich Presence</h3>
  <p>This only applies if you have the Discord app installed and your device supports Rich Presence</p>

  <label>
    <input type="checkbox" id="discord-rpc-enable" />
    Enable Discord Rich Presence
  </label>
  <br/><br/>

  <label>
    <input type="checkbox" id="discord-rpc-details" />
    - Display details within Discord RPC
  </label>
  <br/><br/>

  <p style="border: none; border-top: 1px dashed #ffffff; font-size: 1px; width: 100%"></p>
  <br/>

  <button id="save-btn">Save Settings</button>
  </table>

  <script src="settings.js"></script>
</body>
</html>
